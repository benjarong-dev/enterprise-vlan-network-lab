# /etc/network/interfaces (Linux Edge Router - Router-on-a-Stick)

auto lo
iface lo inet loopback

# WAN Interface (ISP Fiber / Cat6)
auto eth0
iface eth0 inet dhcp

# Gi0/1 Trunk Interface to L2 Switch (SW Gi0/24)
auto eth1
iface eth1 inet manual

# VLAN 10: Management
auto eth1.10
iface eth1.10 inet static
    address 192.168.10.1/24
    vlan-raw-device eth1

# VLAN 20: Core Servers & Virtualization
auto eth1.20
iface eth1.20 inet static
    address 192.168.20.1/24
    vlan-raw-device eth1

# VLAN 30: Staff & Enterprise Wi-Fi
auto eth1.30
iface eth1.30 inet static
    address 192.168.30.1/24
    vlan-raw-device eth1

# VLAN 40: IoT & CCTV (Isolated Zone)
auto eth1.40
iface eth1.40 inet static
    address 192.168.40.1/24
    vlan-raw-device eth1
