! L2 Managed Switch Configuration (TP-Link JetStream / Omada CLI Style)
hostname Branch-Core-SW01
!
spanning-tree
spanning-tree mode rstp
!
vlan 10
 name Management
vlan 20
 name Core_Servers
vlan 30
 name Staff_WiFi
vlan 40
 name IoT_CCTV
!
! --- Management Access Ports (Admin PC & Omada Controller .10.5) ---
interface range gigabitEthernet 1/0/1-4
 description Mgmt_Workstation_and_Omada_Controller
 switchport general allowed vlan 10 untagged
 switchport pvid 10
 spanning-tree portfast
 spanning-tree bpduguard enable
!
! --- Proxmox/KVM Hypervisor Trunk (10G SFP+ & Redundant GbE) ---
interface ten-gigabitEthernet 1/0/1
 description Proxmox_Host_vmbr0_Trunk
 switchport general allowed vlan 10,20 tagged
 switchport pvid 10
!
interface range gigabitEthernet 1/0/5-12
 description Server_Access_and_Backup_Links
 switchport general allowed vlan 10,20 tagged
 switchport pvid 20
!
! --- Omada Enterprise APs (Native Mgmt VLAN 10 + Multi-SSID VLAN 30,40) ---
interface range gigabitEthernet 1/0/13-20
 description Omada_EAP_Multi_SSID_Trunk
 switchport general allowed vlan 10 untagged
 switchport general allowed vlan 30,40 tagged
 switchport pvid 10
!
! --- Wired IP Cameras & IoT Devices (Isolated Access VLAN 40) ---
interface range gigabitEthernet 1/0/21-23
 description CCTV_and_IoT_Endpoints
 switchport general allowed vlan 40 untagged
 switchport pvid 40
 spanning-tree portfast
 spanning-tree bpduguard enable
!
! --- Uplink Trunk to Edge Router/Firewall (FW Gi0/1) ---
interface gigabitEthernet 1/0/24
 description Uplink_Trunk_to_Edge_Firewall
 switchport general allowed vlan 10,20,30,40 tagged
